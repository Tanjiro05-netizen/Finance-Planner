included:
  - ios/Sift
  - ios/SiftTests

excluded:
  - ios/Sift/Resources/Fonts

disabled_rules:
  - trailing_comma

line_length:
  warning: 140
  error: 180

type_body_length:
  warning: 320
  error: 480

file_length:
  warning: 650
  error: 900

custom_rules:
  no_raw_hex_outside_tokens:
    name: "Raw Hex Outside Tokens"
    regex: "#[0-9A-Fa-f]{6,8}"
    included: ".*\\.swift"
    excluded: "ios/Sift/DesignSystem/Tokens.swift"
    message: "Use Palette tokens instead of raw hex literals outside Tokens.swift."
    severity: error

  # The app is set in San Francisco. These three families are gone, and all three are
  # named in the published catalogues of typefaces that read as machine-generated -- so
  # this rule now exists to stop them coming back rather than to route them.
  no_bundled_font_families:
    name: "Bundled Font Families"
    regex: "\"(Fraunces|Fraunces-9pt|Fraunces-9ptSemiBold|Fraunces-9ptBold|Fraunces-Display|Fraunces-Title|Fraunces-Subhead|Plus Jakarta Sans|PlusJakartaSans-Regular|PlusJakartaSans-Medium|PlusJakartaSans-SemiBold|PlusJakartaSans-Bold|IBM Plex Mono|IBMPlexMono-Regular|IBMPlexMono-Medium|IBMPlexMono-SemiBold|IBMPlexMono-Bold)\""
    included: ".*\\.swift"
    message: "Sift is set in San Francisco. Use Font.siftBody and friends from Typography.swift."
    severity: error

  # Font.custom bypasses dynamic optical sizing, automatic tracking, and Dynamic Type --
  # the machinery that made dropping the bundled faces worth doing.
  no_custom_font:
    name: "Custom Font"
    regex: "Font\\.custom\\(|\\.font\\(\\.custom\\("
    included: ".*\\.swift"
    message: "Use a system text style from Typography.swift rather than Font.custom."
    severity: error

  no_inline_animation_duration:
    name: "Inline Animation Duration"
    regex: "\\b(duration|response|dampingFraction|extraBounce):\\s*[0-9]"
    included: ".*\\.swift"
    excluded: "ios/Sift/DesignSystem/Motion.swift"
    message: "Use Motion tokens instead of hardcoded animation timing."
    severity: error
