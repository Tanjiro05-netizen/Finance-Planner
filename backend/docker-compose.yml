services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
      POSTGRES_DB: sift
    ports:
      - "5432:5432"
    volumes:
      - sift-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://sift:sift@postgres:5432/sift?schema=public
      JWT_SECRET: replace-with-a-long-random-string-for-local-dev
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PLAID_ENV: sandbox
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-replace-with-plaid-client-id}
      PLAID_SECRET: ${PLAID_SECRET:-replace-with-plaid-secret}
      PLAID_CLIENT_NAME: Sift
      PLAID_WEBHOOK_URL: http://localhost:3000/v1/webhook/plaid
    ports:
      - "3000:3000"

volumes:
  sift-postgres:
