name: Relay Screenshots

# One-off: pulls already-captured screenshots out of prior Screenshots runs and commits
# them into this branch. Exists because the artifact download URL GitHub hands out points
# at Azure Blob Storage, which the session that needs to look at them cannot reach, while
# a GitHub Actions runner reaches it fine -- so the runner fetches once and hands the bytes
# back over an ordinary git push.
#
# Throwaway by design: this branch and workflow have no purpose beyond relaying a handful
# of PNGs and can be deleted once they have been looked at.
on:
  push:
    branches:
      - 'claude/relay-screenshots'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    name: Relay the three-way comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A — original (claude/swift-rewrite-ios-research-jwvrxo)
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          run-id: 31937182146
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: src/a-original

      - name: B — craft pass (claude/design-craft-pass)
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          run-id: 31743784919
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: src/b-craft

      - name: C — native instrument (claude/design-native-instrument)
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          run-id: 32389963774
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: src/c-native

      # Three screens chosen because each isolates a different axis of the change:
      # home is palette and type, subscriptions is the card-to-row-list restructure,
      # settings is grouping and separators.
      - name: Stage the comparison
        run: |
          rm -rf compare && mkdir -p compare
          for screen in 01-home 04-subscriptions 13-settings 06-insights; do
            for branch in a-original b-craft c-native; do
              if [ -f "src/$branch/$screen.png" ]; then
                cp "src/$branch/$screen.png" "compare/$screen--$branch.png"
              else
                echo "missing: $branch/$screen.png"
              fi
            done
          done
          # C's full set too, so the whole direction can be browsed.
          rm -rf c-full && mkdir -p c-full
          cp src/c-native/*.png c-full/ || true
          rm -f c-full/manifest.json
          ls -la compare c-full

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --cached relay --ignore-unmatch -q || true
          rm -rf relay
          git add -A compare c-full
          git commit -m "relay: three-way design comparison plus branch C in full"
          git push origin HEAD:claude/relay-screenshots
