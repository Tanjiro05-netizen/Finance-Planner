name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Feature branches too. Without this, a branch that is never opened as a PR gets
      # only screenshots.yml -- which runs `-only-testing:SiftUITests/ScreenshotTests`,
      # so it proves the app *compiles* and nothing else. The design branches ran five
      # green screenshot jobs each while the unit suite, SwiftFormat, SwiftLint and the
      # coverage floor had never executed against them once.
      - 'claude/**'

jobs:
  # Build, test, and coverage run on their own so a formatting nit never hides
  # whether the app actually compiles and passes its tests.
  build:
    name: iOS Build & Test
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Build
        run: xcodebuild -scheme Sift -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build
      # SiftUITests/ScreenshotTests is a slow walk that photographs every screen and asserts
      # almost nothing. It is what screenshots.yml runs; there is no reason for the PR gate
      # to pay for it.
      - name: Test with coverage
        run: |
          mkdir -p ../build
          xcodebuild test \
            -scheme Sift \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skip-testing:SiftUITests/ScreenshotTests \
            -enableCodeCoverage YES \
            -resultBundlePath ../build/SiftTests.xcresult
      # On failure xcodebuild only prints the *names* of failing tests. The assertion text
      # — and the crash report when the test process dies and takes every remaining test
      # down with it — live in the result bundle, so surface them in the log.
      - name: Failure diagnostics
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary \
            --path ../build/SiftTests.xcresult --format json || true
          echo "--- crash reports ---"
          python3 ../scripts/print-crash-report.py "$HOME/Library/Logs/DiagnosticReports" || true

      - name: Enforce coverage floor
        run: |
          xcrun xccov view --report --json ../build/SiftTests.xcresult > ../build/ios-coverage.json
          node ../scripts/check-ios-coverage.js ../build/ios-coverage.json 80

  lint:
    name: Lint & Format
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift lint tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat lint
        run: swiftformat --lint .
      # Runs from the repo root: .swiftlint.yml lives there, and its included/excluded
      # paths (ios/Sift, ios/SiftTests) are written relative to it. Running from ios/
      # silently fell back to SwiftLint's defaults, which left the design-system custom
      # rules (raw hex, font literals, inline animation timings) unenforced.
      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml
        working-directory: .
